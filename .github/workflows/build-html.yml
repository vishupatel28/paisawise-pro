name: Build Full HTML

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build index.html from chunks
        run: |
          node -e "
            const fs = require('fs');
            const zlib = require('zlib');
            let b64 = '';
            for (let i = 1; i <= 8; i++) {
              const content = fs.readFileSync('chunk' + i + '.js', 'utf8');
              const match = content.match(/__c\d+=\"([^\"]+)\"/);
              if (match) b64 += match[1];
            }
            b64 = b64.replace(/-/g, '+').replace(/_/g, '/');
            while (b64.length % 4) b64 += '=';
            const compressed = Buffer.from(b64, 'base64');
            const decompressed = zlib.gunzipSync(compressed);
            fs.writeFileSync('index.html', decompressed);
            console.log('index.html built: ' + decompressed.length + ' bytes');
          "

      - name: Commit index.html
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "Auto-build full index.html from chunks [skip ci]"
          git push