<script>
try{
var p="";
for(var i=1;i<=8;i++){p+=window["__c"+i]||"";}
p=p.replace(/-/g,"+").replace(/_/g,"/");
while(p.length%4)p+="=";
var b=atob(p),a=new Uint8Array(b.length);
for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);
var blob=new Blob([a],{type:"text/html;charset=utf-8"});
var url=URL.createObjectURL(blob);
window.location.replace(url);
}catch(e){
document.body.innerHTML='<div style="color:#f87171;text-align:center;padding:40px;font-family:system-ui;font-size:14px">Loading error. Please refresh.<br><br><button onclick="location.reload()" style="padding:12px 30px;background:#d4af37;color:#1a1d2e;border:0;border-radius:8px;font-size:16px;font-weight:600">Retry</button></div>';
}
