<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PaisaWise Pro">
<meta name="theme-color" content="#1a1d2e">
<meta name="application-name" content="PaisaWise Pro">
<title>PaisaWise Pro</title>
<style>body{margin:0;background:#1a1d2e;color:#fff;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100dvh;gap:16px}.spinner{width:40px;height:40px;border:3px solid rgba(255,255,255,0.2);border-top-color:#d4af37;border-radius:50%;animation:spin 0.8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.loading-text{font-size:14px;opacity:0.7}</style>
</head>
<body>
<div class="spinner"></div>
<div class="loading-text">Loading PaisaWise Pro...</div>
<script>
var p="";
function loadChunk(n){
return fetch("chunk"+n+".txt").then(function(r){return r.text()}).then(function(t){
p+=t;
if(n<4)loadChunk(n+1);
else decompress();
});
}
function decompress(){
var b=atob(p),a=new Uint8Array(b.length);
for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);
new Response(new Blob([a]).stream().pipeThrough(new DecompressionStream("gzip"))).text().then(function(t){
document.open();document.write(t);document.close();
}).catch(function(e){
document.body.innerHTML='<div style="color:#f87171;text-align:center;padding:20px">Error loading app. Please refresh.</div>';
});
}
loadChunk(1);
</script>
</body>
</html>
